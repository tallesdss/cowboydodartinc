<!DOCTYPE html>
<!--
  Stripe Checkout success page.

  Stripe redirects the checkout tab here (success_url) after a successful
  payment. It is intentionally a tiny standalone page — NOT the full Flutter
  app — so the user does not end up with two heavy app tabs open, and so the
  "return to the app" button can reliably window.close() this tab (only a light
  page opened via window.open is allowed to close itself). The original app tab
  keeps polling and flips to premium on its own (via the webhook).

  Styled to match the kit's design system (Inter + the same color tokens as the
  Flutter app). Localized from the ?lang= the app appends (the language picked
  IN the app), falling back to the browser language.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Kit design tokens (mirror lib/core/theme/colors.dart). */
    :root {
      --accent: #0485F7;
      --accent-fg: #FFFFFF;
      --success: #17C964;
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --text: #18181B;
      --muted: #71717A;
      --border: rgba(24, 24, 27, 0.10);
      --shadow: 0 12px 40px rgba(24, 24, 27, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #060607;
        --card: #18181B;
        --text: #FCFCFC;
        --muted: #A1A1AA;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(23, 201, 100, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 36px; height: 36px; stroke: var(--success); }
    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
      letter-spacing: -0.2px;
      margin: 0 0 10px;
    }
    p {
      font-size: 16px;
      line-height: 24px;
      color: var(--muted);
      margin: 0 0 28px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-fg);
      background: var(--accent);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.92; }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>
    <h1 id="title">Payment complete</h1>
    <p id="subtitle">Your subscription is confirmed. You can return to the app.</p>
    <button id="close">Return to the app</button>
  </div>

  <script>
    var I18N = {
      en: {
        doc: "Payment complete",
        title: "Payment complete",
        subtitle: "Your subscription is confirmed. You can return to the app.",
        button: "Return to the app",
      },
      pt: {
        doc: "Pagamento concluído",
        title: "Pagamento concluído!",
        subtitle: "Sua assinatura foi confirmada. Você já pode voltar ao aplicativo.",
        button: "Voltar ao aplicativo",
      },
      es: {
        doc: "Pago completado",
        title: "¡Pago completado!",
        subtitle: "Tu suscripción está confirmada. Ya puedes volver a la aplicación.",
        button: "Volver a la aplicación",
      },
    };

    // Prefer the language the app passed (?lang=xx) — the one the user picked
    // IN the app — then fall back to the browser language.
    function pickLang() {
      try {
        var q = new URLSearchParams(window.location.search).get("lang");
        if (q) return q.slice(0, 2).toLowerCase();
      } catch (e) {}
      return (navigator.language || "en").slice(0, 2).toLowerCase();
    }

    var lang = pickLang();
    var t = I18N[lang] || I18N.en;
    document.documentElement.lang = lang in I18N ? lang : "en";
    document.title = t.doc;
    document.getElementById("title").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("close").textContent = t.button;

    // This tab was opened by the app via window.open, so window.close() is
    // allowed. A button click is a user gesture, so it closes reliably and
    // returns focus to the original app tab (already flipped to premium).
    document.getElementById("close").addEventListener("click", function () {
      window.close();
    });
  </script>
</body>
</html>
